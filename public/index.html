<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Translator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background-color: #4b5563;
            border-radius: 9999px;
        }
    </style>
</head>

<body class="bg-gray-900 flex items-center justify-center min-h-screen">
    <div class="w-[500px] h-[400px] bg-gray-800 rounded-2xl shadow-2xl flex flex-col overflow-hidden">
        <div id="chatWindow" class="flex-1 p-4 overflow-y-auto space-y-4 scrollbar-thin">
            <div class="text-sm text-gray-300">
                <div class="mb-1 font-medium text-blue-400">User:</div>
                <div>Hello, how are you?</div>
            </div>
            <div class="text-sm text-gray-300">
                <div class="mb-1 font-medium text-green-400">AI:</div>
                <div>Bonjour, comment ça va ?</div>
            </div>
        </div>

        <div class="p-4 bg-gray-900 border-t border-gray-700">
            <div class="flex  mb-2">
                <input type="text" placeholder="Scrivi un messaggio..."
                    class="flex-1 text-sm text-white bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
                    Invia
                </button>
            </div>
            <div class="flex space-x-2 mb-2">
                <select
                    class="w-full text-sm text-white bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="fr">Francese</option>
                    <option value="es">Spagnolo</option>
                    <option value="de">Tedesco</option>
                    <option value="it">Italiano</option>
                </select>
            </div>
        </div>
    </div>
</body>

</html>
